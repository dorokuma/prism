# Drop-in for prism.service — Gemini OAuth dual-write.
# Bind the Antigravity CLI *directory* so User=prism can see and
# in-place-write antigravity-oauth-token under ProtectHome=true.
#
# The directory is 755 root:root. os.CreateTemp there as User=prism
# always returns EACCES, so StoreAgyToken always falls back to in-place
# truncate+fsync; tmp+rename never succeeds in this unit.
#
# Exposure: the bind makes the whole tree visible to User=prism.
# That is not just conversations privacy. bin/agy is later executed as
# root; updater/, settings.json (0600), and history.jsonl (0600) sit
# beside the token. A compromised prism process that can tamper with
# those is an integrity + privilege-escalation bridge. InaccessiblePaths
# hides the known sensitive siblings (paths that exist on this host).
#
# Confirm InaccessiblePaths vs ReadWritePaths overlay precedence with
# `systemd-analyze verify` (after this drop-in is installed) or a live
# unit before deploying — do not assume which directive wins.
[Service]
ReadWritePaths=/root/.gemini/antigravity-cli
InaccessiblePaths=/root/.gemini/antigravity-cli/bin
InaccessiblePaths=/root/.gemini/antigravity-cli/updater
InaccessiblePaths=/root/.gemini/antigravity-cli/settings.json
InaccessiblePaths=/root/.gemini/antigravity-cli/history.jsonl
